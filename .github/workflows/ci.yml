name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run econometric audit
        run: python scripts/audit_econometrics.py

      - name: Test dashboard builder
        run: python scripts/test_build_dashboard.py

      - name: Verify dashboard data parity
        run: python scripts/build_dashboard.py --check

      - name: Run dashboard tests
        run: node scripts/test_dashboard_full.js
